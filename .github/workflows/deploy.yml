name: Deploy

on:
  push:
    branches: [deploy-app]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      deploy_ios:
        description: "Deploy iOS"
        type: boolean
        default: false
      deploy_android:
        description: "Deploy Android"
        type: boolean
        default: false
      marketing_version:
        description: "Marketing version (e.g. 1.0). Leave empty to use package.json"
        type: string
        default: ""
      generate_aab_only:
        description: "Build AAB without uploading to Google Play (saves as downloadable artifact)"
        type: boolean
        default: false
      production:
        description: "Publish to production (Play Store production track + submit iOS build for App Store review)"
        type: boolean
        default: false
      release_notes:
        description: "Release notes / What's New (required for iOS production submission)"
        type: string
        default: ""

jobs:
  # Which stores this run publishes to. Started from the console (workflow_dispatch):
  # the platforms ticked there. Started by a push to deploy-app or a merged pull
  # request: only the platforms whose signing secrets this repo has, the same rule the
  # console's Deploy tab uses, so a game that isn't on one store never fails there.
  plan:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged == true }}
          ASKED_IOS: ${{ inputs.deploy_ios == true }}
          ASKED_ANDROID: ${{ inputs.deploy_android == true || inputs.generate_aab_only == true }}
          HAS_IOS: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.IOS_EXPORT_OPTIONS_PLIST != '' }}
          HAS_ANDROID: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ios=$ASKED_IOS; android=$ASKED_ANDROID
          elif [ "$EVENT" = "pull_request" ] && [ "$MERGED" != "true" ]; then
            ios=false; android=false
          else
            ios=$HAS_IOS; android=$HAS_ANDROID
            [ "$ios" = "true" ] || echo "::notice::iOS skipped: this repo has no iOS signing secrets, so the game is not set up for the App Store."
            [ "$android" = "true" ] || echo "::notice::Android skipped: this repo has no Android keystore secrets, so the game is not set up for Google Play."
          fi
          echo "ios=$ios" >> "$GITHUB_OUTPUT"
          echo "android=$android" >> "$GITHUB_OUTPUT"

  ios:
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    uses: Bible-Games-Project/bgp-admin/.github/workflows/deploy-ios.yml@main
    with:
      marketing-version: ${{ inputs.marketing_version }}
      bundle-identifier: "com.biblegames.acent"
      submit-for-review: ${{ inputs.production == true }}
      release-notes: ${{ inputs.release_notes }}
    secrets:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_EXPORT_OPTIONS_PLIST: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    uses: Bible-Games-Project/bgp-admin/.github/workflows/deploy-android.yml@main
    with:
      package-name: com.biblegames.acent
      marketing-version: ${{ inputs.marketing_version }}
      skip-upload: ${{ inputs.generate_aab_only == true }}
      play-track: ${{ inputs.production == true && 'production' || 'internal' }}
      release-notes: ${{ inputs.release_notes }}
    secrets:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

  notify:
    needs: [ios, android]
    if: |
      always() && (needs.ios.result != 'skipped' || needs.android.result != 'skipped')
    uses: Bible-Games-Project/bgp-admin/.github/workflows/notify-telegram.yml@main
    with:
      ios-result: ${{ needs.ios.result }}
      android-result: ${{ needs.android.result }}
      app-name: "Bible Trivia Run"
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

  tag:
    needs: [ios, android]
    if: always() && (needs.ios.result == 'success' || needs.android.result == 'success')
    permissions:
      contents: write
    uses: Bible-Games-Project/bgp-admin/.github/workflows/tag-release.yml@main
